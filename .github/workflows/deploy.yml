name: Deploy arcade component

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: quiet-build/.github/.github/workflows/deploy-arcade-component.yml@f874ec46eb04fef8b85cd95ee6dca62b35e526ec
    with:
      support-sha: f874ec46eb04fef8b85cd95ee6dca62b35e526ec
      cloudflare-project-name: kids-defense-arcade
      cloudflare-domain: defense.playminiarcade.com
      prebuild-command: ": # No existing unit-test suite; build and browser gates follow"
      postbuild-command: "pnpm exec playwright test --config playwright.component.config.js && pnpm exec playwright test --config playwright.config.js"
      pages-base: /kids-defense-arcade/
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
